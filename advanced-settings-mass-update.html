<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Settings — Fleet Configuration</title>
<script>
  (function(){
    var t = "dark";
    try { t = localStorage.getItem("adv-settings-theme") || "dark"; } catch(e) {}
    document.documentElement.classList.add(t === "dark" ? "theme-dark" : "theme-light");
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root, .theme-dark{
  --bg:#0c0e12;
  --panel:#14171d;
  --panel-2:#1a1e25;
  --panel-3:#20252e;
  --border:#262c36;
  --border-soft:#1e232b;
  --text:#e9ecf1;
  --muted:#8b93a1;
  --faint:#5b6370;
  --blue:#1668e3;
  --blue-hi:#2f80f2;
  --blue-tint:rgba(47,128,242,.12);
  --pink:#ef3e6d;
  --amber:#f2b544;
  --amber-tint:rgba(242,181,68,.12);
  --green:#3ecf8e;
  --green-tint:rgba(62,207,142,.12);
  --grey-chip:#2a303a;
  --hover-row:rgba(255,255,255,.015);
  --stagebar-bg:rgba(20,23,29,.97);
  --hist-bg:rgba(0,0,0,.18);
  --radius:10px;
  --radius-sm:7px;
}
.theme-light{
  --bg:#f4f6f8;
  --panel:#ffffff;
  --panel-2:#eef1f4;
  --panel-3:#e2e8ee;
  --border:#d1d5db;
  --border-soft:rgba(0,0,0,.10);
  --text:#1a1a1a;
  --muted:#6b7178;
  --faint:#8a919c;
  --blue:#1667d9;
  --blue-hi:#0965a3;
  --blue-tint:rgba(9,101,163,.10);
  --pink:#d81b60;
  --amber:#9a6700;
  --amber-tint:rgba(154,103,0,.10);
  --green:#0f7a52;
  --green-tint:rgba(15,122,82,.10);
  --grey-chip:#e6eaef;
  --hover-row:rgba(0,0,0,.03);
  --stagebar-bg:rgba(255,255,255,.97);
  --hist-bg:rgba(0,0,0,.04);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:14px;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  padding-top:44px;
}

/* ---------- prototype top bar (always dark, matches other Verifi protos) ---------- */
.vp-bar{
  position:fixed;top:0;left:0;right:0;height:44px;
  background:rgba(20,18,16,.97);color:#fff;
  display:flex;align-items:center;padding:0 16px;
  z-index:1000;border-bottom:1px solid rgba(255,255,255,.12);
}
.vp-brand{display:flex;align-items:center;gap:10px}
.vp-logo{width:56px;height:14px}
.vp-logo path{fill:#fff}
.vp-tag{
  font-size:10px;font-weight:500;color:rgba(255,255,255,.55);
  letter-spacing:.4px;text-transform:uppercase;
  padding:2px 6px;border:1px solid rgba(255,255,255,.15);border-radius:4px;
}
.vp-right-cluster{margin-left:auto;display:flex;align-items:center;gap:12px}
.vp-pills{display:flex;gap:2px;background:rgba(255,255,255,.08);border-radius:8px;padding:2px}
.vp-pill{
  font-size:12px;font-weight:500;letter-spacing:-.24px;
  color:rgba(255,255,255,.6);padding:4px 10px;border-radius:6px;
  border:0;background:transparent;cursor:pointer;font-family:inherit;
  transition:background .15s,color .15s;
}
.vp-pill:hover{color:#fff}
.vp-pill.active{background:rgba(255,255,255,.15);color:#fff}
.vp-opts-btn{
  display:flex;align-items:center;gap:6px;padding:5px 10px;
  background:rgba(255,255,255,.08);color:#fff;border-radius:8px;
  border:0;cursor:pointer;font-size:12px;font-weight:500;
  letter-spacing:-.24px;font-family:inherit;transition:background .15s;
}
.vp-opts-btn:hover{background:rgba(255,255,255,.14)}
.vp-opts-wrap{position:relative}
.vp-opts-dd{
  position:absolute;top:calc(100% + 6px);right:0;min-width:210px;
  background:#1a1917;border:1px solid rgba(255,255,255,.1);
  border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.4);
  padding:6px;display:none;z-index:1100;
}
.vp-opts-dd.open{display:block}
.vp-dd-label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.4);padding:6px 10px 4px}
.vp-dd-div{height:1px;background:rgba(255,255,255,.1);margin:6px 4px}
.vp-opt-row{
  display:flex;align-items:center;justify-content:space-between;
  width:100%;padding:8px 10px;border-radius:8px;border:0;
  background:transparent;color:#fff;font-size:13px;font-weight:500;
  font-family:inherit;cursor:pointer;
}
.vp-opt-row:hover{background:rgba(255,255,255,.06)}
.vp-check{color:#4a9eda;font-weight:700;visibility:hidden}
.vp-opt-row.active .vp-check{visibility:visible}
.vp-switch{
  width:34px;height:20px;border-radius:10px;
  background:rgba(255,255,255,.2);position:relative;transition:background .15s;flex-shrink:0;
}
.vp-switch::after{
  content:"";position:absolute;top:2px;left:2px;
  width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;
}
.vp-switch.on{background:#4a9eda}
.vp-switch.on::after{left:16px}

/* ---------- coming-soon overlay (Mobile / Tablet viewports) ---------- */
.coming-soon{
  display:none;position:fixed;top:44px;left:0;right:0;bottom:0;
  background:var(--bg);z-index:900;
  align-items:center;justify-content:center;text-align:center;
}
.coming-soon.show{display:flex}
.cs-inner{max-width:420px;padding:24px}
.cs-inner .cs-logo{width:96px;margin:0 auto 28px;display:block}
.cs-inner .cs-logo path{fill:var(--text)}
.cs-device{
  display:inline-flex;align-items:center;gap:8px;
  font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);border:1px solid var(--border);border-radius:999px;
  padding:5px 14px;margin-bottom:18px;
}
.cs-inner h1{font-size:26px;font-weight:700;color:var(--text);margin-bottom:10px}
.cs-inner p{font-size:14px;line-height:1.6;color:var(--muted);margin-bottom:26px}
.cs-back{
  background:transparent;border:1px solid var(--border);border-radius:6px;
  color:var(--text);font-family:inherit;font-size:13px;font-weight:600;
  padding:10px 18px;cursor:pointer;transition:background .12s;
}
.cs-back:hover{background:var(--hover-row)}

/* ---------- header ---------- */
.app-header{
  display:flex;align-items:center;gap:16px;
  padding:18px 28px;
  border-bottom:1px solid var(--border-soft);
}
.logo{
  width:52px;height:52px;border-radius:8px;
  background:var(--blue);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.logo svg{width:30px;height:30px}
.app-title{font-size:26px;font-weight:800;letter-spacing:-.3px}
.app-sub{font-size:12px;color:var(--muted);margin-top:2px;font-weight:500}

/* ---------- layout ---------- */
.layout{display:flex;height:calc(100vh - 89px - 44px)}

/* ---------- left rail ---------- */
.rail{
  width:296px;flex-shrink:0;
  border-right:1px solid var(--border-soft);
  display:flex;flex-direction:column;
  padding:20px 0 0 0;
}
.rail-inner{padding:0 20px}
.search-box{
  display:flex;align-items:center;gap:8px;
  background:var(--panel-2);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:10px 12px;
}
.search-box input{
  flex:1;background:none;border:none;outline:none;
  color:var(--text);font-family:inherit;font-size:13px;
}
.search-box input::placeholder{color:var(--faint)}
.search-box .clear-x{color:var(--faint);cursor:pointer;font-size:15px;line-height:1;background:none;border:none}
.search-box .clear-x:hover{color:var(--text)}

.rail-controls{
  display:flex;align-items:center;justify-content:space-between;
  margin:18px 0 10px;
  padding-bottom:12px;
  border-bottom:2px solid var(--border);
}
.all-trucks{
  display:flex;align-items:center;gap:10px;
  font-weight:600;font-size:13.5px;cursor:pointer;user-select:none;
}
.clear-all{
  background:none;border:none;color:var(--muted);
  font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;
}
.clear-all:hover{color:var(--text)}

.truck-list{flex:1;overflow-y:auto;padding:4px 20px 20px}
.truck-row{
  display:flex;align-items:center;gap:10px;
  padding:9px 6px;border-radius:6px;cursor:pointer;user-select:none;
}
.truck-row:hover{background:var(--panel-2)}
.truck-name{font-size:13.5px;color:var(--text);font-weight:500}
.truck-contract{font-size:11px;color:var(--faint);margin-top:1px}
.truck-row.hidden{display:none}

/* checkboxes */
.cb{
  width:17px;height:17px;flex-shrink:0;
  border:1.5px solid var(--faint);border-radius:4px;
  display:flex;align-items:center;justify-content:center;
  background:transparent;transition:all .12s;
}
.cb svg{width:11px;height:11px;opacity:0}
.cb.checked{background:var(--blue);border-color:var(--blue)}
.cb.checked svg{opacity:1}
.cb.pink.checked, .cb.pink.partial{background:var(--pink);border-color:var(--pink)}
.cb.partial{background:var(--pink);border-color:var(--pink)}
.cb.partial::after{content:'';width:8px;height:2px;background:#fff;border-radius:1px}
.cb.partial svg{display:none}

/* ---------- main ---------- */
.main{flex:1;overflow-y:auto;padding:24px 32px 140px;scroll-behavior:smooth}

/* summary bar */
.summary-bar{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  background:var(--panel);
  border:1px solid var(--border-soft);
  border-radius:var(--radius);
  padding:16px 20px;
  margin-bottom:22px;
}
.summary-count{display:flex;flex-direction:column;gap:2px;padding-right:18px;border-right:1px solid var(--border)}
.summary-count .label{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.summary-count .num{font-size:20px;font-weight:700}
.summary-chips{display:flex;gap:8px;flex-wrap:wrap;flex:1}
.sum-chip{
  display:inline-flex;align-items:center;gap:7px;
  font-size:12px;font-weight:600;
  padding:6px 12px;border-radius:20px;
  background:var(--grey-chip);color:var(--muted);
}
.sum-chip .dot{width:7px;height:7px;border-radius:50%}
.sum-chip.mixed{background:var(--amber-tint);color:var(--amber)}
.sum-chip.mixed .dot{background:var(--amber)}
.sum-chip.pending{background:var(--amber-tint);color:var(--amber)}
.sum-chip.pending .dot{background:var(--amber);animation:pulse 1.4s infinite}
.sum-chip.confirmed{background:var(--green-tint);color:var(--green)}
.sum-chip.confirmed .dot{background:var(--green)}
.sum-chip.novalue .dot{background:var(--faint)}
.empty-hint{color:var(--faint);font-size:13px}

/* contract groups in rail */
.group-head{
  display:flex;align-items:center;gap:10px;
  padding:10px 6px 8px;margin-top:6px;
  cursor:pointer;user-select:none;
  border-bottom:1px solid var(--border-soft);
}
.group-name{flex:1;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.group-count{font-size:11px;color:var(--faint);font-weight:600}
.group-chev{color:var(--faint);transition:transform .15s;display:flex}
.truck-group.collapsed .group-chev{transform:rotate(180deg)}
.truck-group.collapsed .truck-row{display:none}

/* clickable exception chips */
.v-chip.clickable{cursor:pointer;transition:filter .1s}
.v-chip.clickable:hover{filter:brightness(1.35)}
.v-chip.exc{background:var(--amber-tint);color:var(--amber)}
.v-chip.exc .dot{background:var(--amber)}
.v-chip.active-filter{outline:1.5px solid currentColor}

/* detail filter + pagination */
.filter-bar{
  display:flex;align-items:center;gap:10px;
  font-size:12px;font-weight:600;color:var(--amber);
  background:var(--amber-tint);
  padding:8px 12px;border-radius:6px;margin-bottom:10px;
}
.filter-bar button{
  background:none;border:1px solid var(--amber);color:var(--amber);
  font-family:inherit;font-size:11px;font-weight:700;
  padding:3px 10px;border-radius:12px;cursor:pointer;
}
.show-more-wrap{display:flex;align-items:center;gap:12px;padding:10px 0 0}
.show-more{
  background:var(--panel-3);border:1px solid var(--border);color:var(--text);
  font-family:inherit;font-size:12px;font-weight:600;
  padding:7px 16px;border-radius:16px;cursor:pointer;
}
.show-more:hover{border-color:var(--faint)}
.showing-count{font-size:11.5px;color:var(--faint)}

/* issues-only toggle */
.pill-toggle{
  background:var(--panel-2);border:1px solid var(--border);color:var(--muted);
  font-family:inherit;font-size:12.5px;font-weight:600;
  padding:9px 16px;border-radius:20px;cursor:pointer;white-space:nowrap;
}
.pill-toggle.active{background:var(--amber-tint);border-color:var(--amber);color:var(--amber)}
.sum-chip.clickable{cursor:pointer}
.sum-chip.clickable:hover{filter:brightness(1.3)}
.sum-chip.active-filter{outline:1.5px solid currentColor}

/* ---------- truck-focused view: accordions + drawer ---------- */
.tf-toolbar{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.tf-count{font-size:13.5px;color:var(--muted)}
.tf-count b{color:var(--text);font-weight:700}
.tf-update-btn{margin-left:auto}

.truck-card{
  background:var(--panel);border:1px solid var(--border-soft);
  border-radius:var(--radius);margin-bottom:12px;overflow:hidden;
}
.tc-head{
  display:flex;align-items:center;gap:16px;
  padding:14px 20px;cursor:pointer;user-select:none;flex-wrap:wrap;
}
.tc-head:hover{background:var(--hover-row)}
.tc-name{font-size:15px;font-weight:700;min-width:150px}
.tc-contract{font-size:11px;color:var(--faint);font-weight:500;margin-top:1px}
.tc-info{display:flex;gap:22px;flex:1;flex-wrap:wrap}
.tc-field{display:flex;flex-direction:column;gap:1px}
.tc-field .k{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:700}
.tc-field .v{font-size:12.5px;font-weight:600;color:var(--text)}
.tc-field .v.warn{color:var(--amber)}
.tc-chevron{
  width:28px;height:28px;border-radius:50%;background:var(--panel-3);
  display:flex;align-items:center;justify-content:center;color:var(--muted);
  transition:transform .18s;flex-shrink:0;
}
.truck-card.open .tc-chevron{transform:rotate(180deg)}
.tc-body{display:none;border-top:1px solid var(--border-soft);padding:6px 20px 16px}
.truck-card.open .tc-body{display:block}
.tc-sec-label{
  font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--faint);padding:14px 0 6px;border-bottom:1px solid var(--border-soft);margin-bottom:2px;
}
.tc-row{
  display:flex;align-items:center;gap:12px;
  padding:7px 0;border-bottom:1px solid var(--border-soft);font-size:12.5px;
}
.tc-row:last-child{border-bottom:none}
.tc-row .n{flex:1;font-weight:500;color:var(--text)}
.tc-row .n.dimmed{color:var(--faint)}
.tc-row .val{font-weight:700;min-width:110px;text-align:right}
.tc-row .meta{color:var(--faint);font-size:11.5px;min-width:190px;text-align:right}

/* drawer */
.drawer-backdrop{
  position:fixed;inset:0;background:rgba(5,7,10,.5);
  display:none;z-index:80;
}
.drawer-backdrop.open{display:block}
.drawer{
  position:fixed;top:44px;right:0;bottom:0;width:440px;max-width:92vw;
  background:var(--panel);border-left:1px solid var(--border);
  display:flex;flex-direction:column;
  box-shadow:-12px 0 32px rgba(0,0,0,.35);
}
.drawer-head{display:flex;align-items:flex-start;gap:12px;padding:20px 22px 14px}
.drawer-title{font-size:17px;font-weight:800}
.drawer-sub{font-size:12px;color:var(--muted);margin-top:3px}
.drawer-x{
  margin-left:auto;background:none;border:none;color:var(--muted);
  font-size:22px;line-height:1;cursor:pointer;font-family:inherit;
}
.drawer-x:hover{color:var(--text)}
.drawer-search{padding:0 22px 12px;border-bottom:1px solid var(--border-soft)}
.drawer-list{flex:1;overflow-y:auto;padding:8px 22px 16px}
.dr-sec-label{
  font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--faint);padding:14px 0 6px;
}
.dr-item{border-bottom:1px solid var(--border-soft);padding:9px 0}
.dr-item-main{display:flex;align-items:center;gap:11px;cursor:pointer;user-select:none}
.dr-name{flex:1;font-size:13px;font-weight:500}
.dr-input{display:flex;align-items:center;gap:10px;padding:10px 0 4px 28px}
.dr-input label{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--blue-hi);font-weight:700}
.drawer-foot{
  display:flex;align-items:center;gap:10px;
  padding:14px 22px;border-top:1px solid var(--border);
}
.drawer-count{flex:1;font-size:12.5px;color:var(--muted)}

/* settings search toolbar */
.settings-toolbar{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.settings-toolbar .search-box{max-width:380px;flex:1}
.setting-count{font-size:12px;color:var(--faint);font-weight:500}

/* non-functional settings (flagged, pending removal) */
.setting-row.nonfunc .setting-name{color:var(--faint)}
.setting-row.nonfunc .setting-main{cursor:default}
.nonfunc-tag{
  font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  background:var(--amber-tint);color:var(--amber);
  padding:3px 9px;border-radius:10px;flex-shrink:0;
}
.cb.disabled{border-color:var(--border);background:var(--panel-2);cursor:not-allowed}

/* single-truck inline value */
.inline-val{display:flex;align-items:baseline;gap:10px;justify-content:flex-end;flex:1;min-width:0}
.inline-val .val{font-weight:700;font-size:13.5px}
.inline-val .meta{font-size:11.5px;color:var(--faint);white-space:nowrap}

/* history drill-in */
tr.truck-click{cursor:pointer}
tr.truck-click:hover td{background:rgba(255,255,255,.02)}
.hist-caret{display:inline-block;transition:transform .15s;color:var(--faint);margin-right:7px;font-size:10px}
tr.hist-open .hist-caret{transform:rotate(90deg)}
td.hist-cell{padding:0 12px 12px 26px !important;background:var(--hist-bg)}
.hist-title{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 0 6px}
table.hist{width:100%;border-collapse:collapse}
table.hist td{padding:6px 10px;font-size:12.5px;border-bottom:1px solid var(--border-soft);color:var(--text)}
table.hist tr:last-child td{border-bottom:none}
table.hist td.dim{color:var(--muted)}
.hist-current{color:var(--blue-hi);font-weight:700;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase}

/* section cards — masonry columns so short cards don't leave gaps */
.sec-cols{columns:2;column-gap:16px}
.section-card{
  background:var(--panel);
  border:1px solid var(--border-soft);
  border-radius:var(--radius);
  overflow:hidden;
  min-width:0;
  break-inside:avoid;
  margin-bottom:16px;
}
.section-card.full{column-span:all}
@media (max-width:1500px){ .sec-cols{columns:1} }
.section-head{
  display:flex;align-items:center;gap:12px;
  padding:16px 20px;cursor:pointer;user-select:none;
}
.section-head .gear{color:var(--muted);display:flex}
.section-title-wrap{flex:1}
.section-title{font-size:16px;font-weight:700;display:inline-block}
.section-title::after{content:'';display:block;height:3px;width:60%;min-width:56px;background:var(--blue);border-radius:2px;margin-top:5px}
.section-meta{display:flex;align-items:center;gap:8px}
.staged-pill{
  font-size:11px;font-weight:700;
  background:var(--blue-tint);color:var(--blue-hi);
  padding:4px 10px;border-radius:12px;
}
.section-chevron{
  width:30px;height:30px;border-radius:50%;
  background:var(--panel-3);
  display:flex;align-items:center;justify-content:center;
  color:var(--muted);transition:transform .18s;
}
.section-card.collapsed .section-chevron{transform:rotate(180deg)}
.section-card.collapsed .section-body{display:none}
.readonly-tag{
  font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  background:var(--grey-chip);color:var(--muted);
  padding:4px 10px;border-radius:12px;
}

/* setting rows */
.section-body{border-top:1px solid var(--border-soft)}
.setting-row{border-bottom:1px solid var(--border-soft)}
.setting-row:last-child{border-bottom:none}
.setting-main{
  display:flex;align-items:center;gap:12px;
  padding:11px 18px;cursor:pointer;
}
.setting-main:hover{background:var(--hover-row)}
.setting-name{font-weight:600;font-size:13px;flex:1;min-width:0}
.setting-unit{color:var(--faint);font-weight:500;font-size:12px;margin-left:5px}
.type-tag{
  font-size:10.5px;font-weight:600;letter-spacing:.04em;
  color:var(--faint);
  border:1px solid var(--border);
  padding:2.5px 8px;border-radius:10px;flex-shrink:0;
}
.value-chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.v-chip{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11.5px;font-weight:600;
  padding:4px 10px;border-radius:12px;
  background:var(--grey-chip);color:var(--text);
}
.v-chip .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.v-chip.uniform .dot{background:var(--blue-hi)}
.v-chip.mixed{background:var(--amber-tint);color:var(--amber)}
.v-chip.mixed .dot{background:var(--amber)}
.v-chip.novalue{color:var(--muted)}
.v-chip.novalue .dot{background:var(--faint)}
.v-chip.pending{background:var(--amber-tint);color:var(--amber)}
.v-chip.pending .dot{background:var(--amber);animation:pulse 1.4s infinite}
.v-chip.confirmed{background:var(--green-tint);color:var(--green)}
.v-chip.confirmed .dot{background:var(--green)}
.v-chip.stagedchip{background:var(--blue-tint);color:var(--blue-hi)}
.v-chip.stagedchip .dot{background:var(--blue-hi)}
.row-chevron{color:var(--faint);transition:transform .15s;flex-shrink:0}
.setting-row.open .row-chevron{transform:rotate(180deg)}

/* staged input area */
.stage-input{
  display:none;
  align-items:center;gap:12px;flex-wrap:wrap;
  padding:12px 18px 14px 47px;
  background:rgba(47,128,242,.05);
  border-top:1px dashed rgba(47,128,242,.25);
}
.setting-row.staged .stage-input{display:flex}
.stage-input label{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--blue-hi);font-weight:700}
.num-input, .sel-input{
  background:var(--panel-2);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  color:var(--text);
  font-family:inherit;font-size:13px;
  padding:8px 12px;width:180px;outline:none;
}
.num-input:focus, .sel-input:focus{border-color:var(--blue-hi)}
.sel-input{width:220px;cursor:pointer}
/* toggle segmented */
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--border);border-radius:20px;padding:3px}
.seg button{
  background:none;border:none;color:var(--muted);
  font-family:inherit;font-size:12px;font-weight:600;
  padding:6px 18px;border-radius:16px;cursor:pointer;
}
.seg button.active{background:var(--blue);color:#fff}

/* expanded per-truck table */
.detail{display:none;padding:0 18px 16px 18px}
.setting-row.open .detail{display:block}
.warn-banner{
  display:flex;align-items:center;
  border-left:3px solid var(--amber);
  background:rgba(242,181,68,.06);
  color:var(--text);
  font-size:12.5px;font-weight:500;
  padding:11px 14px;border-radius:0 6px 6px 0;
  margin-bottom:12px;
}
table.tt{width:100%;border-collapse:collapse}
table.tt th{
  text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);font-weight:700;
  padding:8px 12px;border-bottom:1px solid var(--border);
}
table.tt td{
  padding:9px 12px;font-size:13px;
  border-bottom:1px solid var(--border-soft);
  color:var(--text);
}
table.tt tr:last-child td{border-bottom:none}
table.tt td.dim{color:var(--muted)}
.status-cell{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600}
.status-cell .dot{width:7px;height:7px;border-radius:50%}
.status-cell.reported{color:var(--muted)}
.status-cell.reported .dot{background:var(--faint)}
.status-cell.novalue{color:var(--muted)}
.status-cell.novalue .dot{background:var(--faint)}
.status-cell.pending{color:var(--amber)}
.status-cell.pending .dot{background:var(--amber);animation:pulse 1.4s infinite}
.status-cell.confirmed{color:var(--green)}
.status-cell.confirmed .dot{background:var(--green)}

/* info (read-only) table wrapper */
.info-wrap{padding:6px 20px 18px;overflow-x:auto}

/* sticky footer bar */
.stage-bar{
  position:fixed;left:296px;right:0;bottom:0;
  background:var(--stagebar-bg);
  border-top:1px solid var(--border);
  backdrop-filter:blur(8px);
  display:none;
  align-items:center;gap:18px;
  padding:16px 32px;
  z-index:40;
}
.stage-bar.visible{display:flex}
.stage-bar .info{flex:1;font-size:13.5px;color:var(--muted)}
.stage-bar .info b{color:var(--text);font-weight:700}
.btn{
  font-family:inherit;font-size:13.5px;font-weight:600;
  border-radius:22px;padding:11px 24px;cursor:pointer;border:none;
  transition:background .12s;
}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-hi)}
.btn-primary:disabled{background:var(--panel-3);color:var(--faint);cursor:not-allowed}
.btn-ghost{background:none;color:var(--muted);border:1px solid var(--border)}
.btn-ghost:hover{color:var(--text);border-color:var(--faint)}

/* modal */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(5,7,10,.7);
  display:none;align-items:center;justify-content:center;z-index:100;
}
.modal-backdrop.visible{display:flex}
.modal{
  width:640px;max-width:92vw;max-height:84vh;overflow-y:auto;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  padding:26px 28px;
}
.modal h2{font-size:19px;font-weight:800;margin-bottom:6px}
.modal .sub{color:var(--muted);font-size:13px;line-height:1.55;margin-bottom:18px}
.modal .sub b{color:var(--text)}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
.newval{color:var(--blue-hi);font-weight:700}

/* toast */
.toast{
  position:fixed;bottom:96px;right:28px;z-index:120;
  background:var(--panel-3);
  border:1px solid var(--border);
  border-left:3px solid var(--green);
  border-radius:8px;
  padding:14px 18px;
  font-size:13px;font-weight:600;
  display:flex;align-items:center;gap:10px;
  opacity:0;transform:translateY(8px);
  transition:all .25s;pointer-events:none;
}
.toast.show{opacity:1;transform:translateY(0)}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* scrollbars */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--panel-3);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}
</style>
</head>

/* deterministic pseudo-random per truck+setting */
function hash(s){let h=0;for(let i=0;i<s.length;i++){h=((h<<5)-h+s.charCodeAt(i))|0}return Math.abs(h)}
function rnd(seed){const x=Math.sin(seed)*10000;return x-Math.floor(x)}

const DATES = ['Jun 2, 2026','Jun 18, 2026','Jul 4, 2026','Jul 22, 2026','Aug 1, 2026','Aug 9, 2026','Aug 14, 2026','Aug 18, 2026'];
const SUBMITTERS = ['A. Rivera','M. Chen','D. Okafor','S. Patel','K. Novak'];

const LOCKED_MAP = {ro_contract:'Contract', ro_unit:'Unit', ro_mixer:'Mixer Type', ro_vin:'VIN'};

// state[truckId][settingId] = {value, lastUpdated, source, submitter, status}
const state = {};
TRUCKS.forEach((t,ti)=>{
  state[t.id]={};
  // read-only info (built first so locked settings can seed from it)
  const iseed = hash(t.id+':info');
  t.info = {
    'Contract': t.contract,
    'Unit': 'U-2'+String(3000+ti*37)+'QQLAGT',
    'Mixer Type': MIXERS[Math.floor(rnd(iseed)*MIXERS.length)],
    'VIN': rnd(iseed+9)<0.5?'—':'1HTMM'+String(100000+Math.floor(rnd(iseed+11)*899999))
  };
  SETTINGS.forEach(s=>{
    const seed = hash(t.id+':'+s.id);
    const r = rnd(seed);
    const big = t.contract==='Cemex Arizona';
    let entry;
    if(s.locked){
      entry = {value: t.info[LOCKED_MAP[s.id]], lastUpdated:null, source:null, submitter:null, status:'reported'};
    } else if(s.type==='select'){
      const r2 = rnd(seed+3);
      const defP = big ? 0.985 : 0.8;
      const val = r2 < defP ? s.def : s.options[1 + Math.floor(rnd(seed+5)*(s.options.length-1))];
      const source = rnd(seed+13) < 0.4 ? 'Truck' : 'Hub';
      entry = {
        value: val,
        lastUpdated: DATES[Math.floor(rnd(seed+7)*DATES.length)],
        source: source,
        submitter: source==='Hub' ? SUBMITTERS[Math.floor(rnd(seed+21)*SUBMITTERS.length)] : 'Truck (device)',
        status:'reported'
      };
    } else if(s.functional===false || r < (big?0.015:0.12)){
      entry = {value:null, lastUpdated:null, source:null, submitter:null, status:'novalue'};
    } else {
      let val;
      const defP = big ? 0.96 : (s.type==='toggle' ? 0.72 : 0.7);
      const rv = rnd(seed+1);
      if(s.type==='toggle'){ val = rv < defP ? s.def : !s.def; }
      else { val = rv < defP ? s.def : s.alt; }
      const fromHub = rnd(seed+13) >= 0.7 ? false : true; // Truck 70%, Hub 30%... keep prior split
      const source = rnd(seed+13) < 0.7 ? 'Truck' : 'Hub';
      entry = {
        value: val,
        lastUpdated: DATES[Math.floor(rnd(seed+7)*DATES.length)],
        source: source,
        submitter: source==='Hub' ? SUBMITTERS[Math.floor(rnd(seed+21)*SUBMITTERS.length)] : 'Truck (device)',
        status:'reported'
      };
    }
    state[t.id][s.id]=entry;
  });
});

/* ---- change history (lazy, deterministic) ---- */
const histCache = {};
function getHistory(tid, sid){
  const key = tid+':'+sid;
  if(histCache[key]) return histCache[key];
  const s = SETTINGS.find(x=>x.id===sid);
  const e = state[tid][sid];
  const seed = hash(key+':hist');
  const out = [];
  if(e.value!==null){
    out.push({value:e.value, date:e.lastUpdated, submitter:e.submitter, source:e.source});
    const older = 1 + Math.floor(rnd(seed)*3); // 1–3 older entries
    for(let i=0;i<older;i++){
      const r2 = rnd(seed + i*17 + 5);
      let v;
      if(s.type==='toggle') v = r2<0.5 ? s.def : !s.def;
      else if(s.type==='select') v = s.options[Math.floor(r2*s.options.length)];
      else v = r2<0.5 ? s.def : s.alt;
      const fromHub = rnd(seed+i*29+9) < 0.55;
      out.push({
        value: v,
        date: DATES[Math.max(0, Math.floor(rnd(seed+i*7)*DATES.length) - (i+2))] || 'May 12, 2026',
        submitter: fromHub ? SUBMITTERS[Math.floor(rnd(seed+i*31)*SUBMITTERS.length)] : 'Truck (device)',
        source: fromHub ? 'Hub' : 'Truck'
      });
    }
  }
  histCache[key]=out;
  return out;
}
function toggleHistory(tid, sid){
  const key = tid+':'+sid;
  openHistory.has(key)?openHistory.delete(key):openHistory.add(key);
  renderActive();
}

/* ============ ROLLUP LOGIC ============ */
function fmtVal(s, v){
  if(v===null||v===undefined) return '—';
  if(s.type==='toggle') return v?'On':'Off';
  if(s.type==='select'||s.type==='text') return v;
  return v + (s.unit?' '+s.unit:'');
}
function rollup(s){
  const trucks = [...selected];
  const entries = trucks.map(tid=>state[tid][s.id]);
  const withVal = entries.filter(e=>e.value!==null);
  const noVal = entries.length - withVal.length;
  const pending = entries.filter(e=>e.status==='pending').length;
  const confirmed = entries.filter(e=>e.status==='confirmed').length;
  const distinct = [...new Set(withVal.map(e=>JSON.stringify(e.value)))];
  // group trucks by value, largest first
  const byVal = {};
  const noValTids = [];
  trucks.forEach(tid=>{
    const e = state[tid][s.id];
    if(e.value===null){ noValTids.push(tid); return; }
    const k = JSON.stringify(e.value);
    (byVal[k]=byVal[k]||[]).push(tid);
  });
  const groups = Object.entries(byVal).map(([key,tids])=>({key, value:JSON.parse(key), tids}))
    .sort((a,b)=>b.tids.length-a.tids.length);
  return {entries, withVal, noVal, pending, confirmed, distinct, trucks, groups, noValTids};
}
function truckName(tid){ return TRUCKS.find(x=>x.id===tid).name; }

}

function buildFleetChips(s, r){
  let chips = '';

  if(isStaged) chips += `<span class="v-chip stagedchip"><span class="dot"></span>Staged → ${fmtVal(s, staged[s.id])}</span>`;
  if(r.pending>0) chips += `<span class="v-chip pending"><span class="dot"></span>${r.pending} pending</span>`;
  if(r.confirmed>0) chips += `<span class="v-chip confirmed"><span class="dot"></span>${r.confirmed} confirmed</span>`;
  const f = rowFilter[s.id];
  if(r.withVal.length>0){
    if(r.distinct.length===1){
      chips += `<span class="v-chip uniform"><span class="dot"></span>All: ${fmtVal(s, r.groups[0].value)}</span>`;
    } else if(r.groups.length>1 && r.groups[0].tids.length===r.groups[1].tids.length){
      chips += r.groups.map(g=>{
        const act = f && f.kind==='value' && f.key===g.key ? 'active-filter':'';
        return `<span class="v-chip exc clickable ${act}" onclick="event.stopPropagation();filterRow('${s.id}','value','${g.key.replace(/'/g,"\\'")}')"><span class="dot"></span>Split · ${g.tids.length} → ${fmtVal(s,g.value)}</span>`;
      }).join('');
    } else {
      const maj = r.groups[0];
      chips += `<span class="v-chip uniform"><span class="dot"></span>Most: ${fmtVal(s, maj.value)} · ${maj.tids.length}</span>`;
      r.groups.slice(1).forEach(g=>{
        const act = f && f.kind==='value' && f.key===g.key ? 'active-filter':'';
        const label = g.tids.length<=3
          ? `${g.tids.map(truckName).join(', ')} → ${fmtVal(s,g.value)}`
          : `${g.tids.length} trucks → ${fmtVal(s,g.value)}`;
        chips += `<span class="v-chip exc clickable ${act}" onclick="event.stopPropagation();filterRow('${s.id}','value','${g.key.replace(/'/g,"\\'")}')"><span class="dot"></span>${label}</span>`;
      });
    }
  }
  if(r.noVal>0){
    const act = f && f.kind==='novalue' ? 'active-filter':'';
    const label = r.noValTids.length<=3
      ? `${r.noValTids.map(truckName).join(', ')} → no value`

    chips += `<span class="v-chip novalue clickable ${act}" onclick="event.stopPropagation();filterRow('${s.id}','novalue','')"><span class="dot"></span>${label}</span>`;
  }
  return chips;
}

        const hKey = tid+':'+s.id;
        const hOpen = openHistory.has(hKey);
        let rows = `<tr class="truck-click ${hOpen?'hist-open':''}" onclick="event.stopPropagation();toggleHistory('${tid}','${s.id}')" title="View change history">
          <td style="font-weight:600"><span class="hist-caret">▶</span>${t.name}</td>
          <td>${fmtVal(s, e.value)}</td>
          <td class="dim">${e.lastUpdated||'—'}</td>
          <td class="dim">${e.submitter||'—'}</td>
          <td class="dim">${e.source||'—'}</td>
          <td><span class="status-cell ${st.cls}"><span class="dot"></span>${st.label}</span></td>
        </tr>`;
        if(hOpen){
          const hist = getHistory(tid, s.id);
          rows += `<tr><td class="hist-cell" colspan="6">
            <div class="hist-title">Change history — ${t.name}</div>
            ${hist.length===0
              ? `<div style="color:var(--faint);font-size:12.5px;padding:4px 0">No history — this setting has never reported a value for this truck.</div>`
              : `<table class="hist">${hist.map((h,i)=>`
                  <tr>
                    <td style="font-weight:600;width:120px">${fmtVal(s, h.value)}</td>
                    <td class="dim" style="width:130px">${h.date}</td>
                    <td class="dim">${h.submitter}</td>
                    <td class="dim" style="width:70px">${h.source}</td>
                    <td style="width:80px;text-align:right">${i===0?'<span class="hist-current">Current</span>':''}</td>
                  </tr>`).join('')}</table>`}
          </td></tr>`;
        }
        return rows;
      }).join('')}
    </table>
    ${detailTrucks.length>shown?`<div class="show-more-wrap">
      <button class="show-more" onclick="event.stopPropagation();showMore('${s.id}')">Show ${Math.min(PAGE, detailTrucks.length-shown)} more</button>
      <span class="showing-count">Showing ${pageTrucks.length} of ${detailTrucks.length}</span>
    </div>`:(detailTrucks.length>PAGE?`<div class="show-more-wrap"><span class="showing-count">Showing all ${detailTrucks.length}</span></div>`:'')}`;
}

function renderSettingRow(s){
  // locked identity fields: read only, expandable, never stageable
  if(s.locked){
    const r = rollup(s);
    const isOpen = openRows.has(s.id);
    const single = selected.size===1;
    let middle;
    if(single){
      const e = state[[...selected][0]][s.id];
      middle = `<div class="inline-val"><span class="val">${fmtVal(s, e.value)}</span><span class="meta">Read only</span></div>`;
    } else {
      const chip = r.distinct.length===1
        ? `<span class="v-chip uniform"><span class="dot"></span>All: ${fmtVal(s, JSON.parse(r.distinct[0]))}</span>`
        : `<span class="v-chip novalue"><span class="dot"></span>${r.distinct.length} values across ${selected.size} trucks</span>`;
      middle = `<div class="value-chips">${chip}</div>`;
    }
    const lShown = detailShown[s.id] || PAGE;
    const lPage = r.trucks.slice(0, lShown);
    const detail = `<table class="tt">
      <tr><th>Truck Name</th><th>Value</th></tr>
      ${lPage.map(tid=>{
        const t = TRUCKS.find(x=>x.id===tid);
        return `<tr><td style="font-weight:600">${t.name}</td><td class="dim">${fmtVal(s, state[tid][s.id].value)}</td></tr>`;
      }).join('')}
    </table>
    ${r.trucks.length>lShown?`<div class="show-more-wrap">
      <button class="show-more" onclick="event.stopPropagation();showMore('${s.id}')">Show ${Math.min(PAGE, r.trucks.length-lShown)} more</button>
      <span class="showing-count">Showing ${lPage.length} of ${r.trucks.length}</span>
    </div>`:''}`;
    return `<div class="setting-row ${isOpen?'open':''}" id="row-${s.id}">
      <div class="setting-main" onclick="toggleRow('${s.id}')">
        <div class="cb disabled" style="display:flex;color:var(--faint)" title="Read only — set per truck on the truck's Configuration page">${LOCK}</div>
        <div class="setting-name" style="color:var(--muted)">${s.name}</div>
        <span class="readonly-tag">Read only</span>
        ${middle}
        <span class="row-chevron">${CHEV}</span>
      </div>
      <div class="detail">${detail}</div>
    </div>`;
  }

  // non-functional: flagged, dimmed, not stageable, not expandable
  if(s.functional===false){
    return `<div class="setting-row nonfunc" id="row-${s.id}">
      <div class="setting-main">
        <div class="cb disabled" title="Not functional — cannot be updated"></div>
        <div class="setting-name">${s.name}</div>
        <span class="type-tag">${typeLabel(s)}</span>
        <div class="value-chips"><span class="nonfunc-tag">Not functional · pending removal</span></div>
        <span class="row-chevron" style="visibility:hidden">${CHEV}</span>
      </div>
    </div>`;
  }

  const r = rollup(s);
  const isStaged = staged[s.id]!==undefined;
  const isOpen = openRows.has(s.id);
  const single = selected.size===1;

  // middle content: rollup chips (multi) or inline value (single truck)
  let middle = '';
  if(single){
    const tid = [...selected][0];
    const e = state[tid][s.id];
    const statusChip =
      e.status==='pending'   ? `<span class="v-chip pending"><span class="dot"></span>Pending</span>` :
      e.status==='confirmed' ? `<span class="v-chip confirmed"><span class="dot"></span>Confirmed</span>` : '';
    middle = `<div class="inline-val">
      ${isStaged?`<span class="v-chip stagedchip"><span class="dot"></span>Staged → ${fmtVal(s, staged[s.id])}</span>`:''}
      ${statusChip}
      <span class="val">${fmtVal(s, e.value)}</span>
      <span class="meta">${e.value===null?'No value reported':`Updated ${e.lastUpdated} · ${e.submitter}`}</span>
    </div>`;
  } else {
    middle = `<div class="value-chips">${buildFleetChips(s, r)}</div>`;
  }

  // staged input control (shared with setting-focused view)
  let control = buildControl(s);

  // detail table (shared with setting-focused view)
  const detail = buildDetailTable(s, r);

  return `<div class="setting-row ${isStaged?'staged':''} ${isOpen?'open':''}" id="row-${s.id}">
    <div class="setting-main" onclick="toggleRow('${s.id}')">
      <div class="cb ${isStaged?'checked':''}" onclick="event.stopPropagation();toggleStage('${s.id}')" title="Stage for update">
        <svg viewBox="0 0 12 12" fill="none"><path d="M2 6.5 4.8 9 10 3.5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="setting-name">${s.name}${s.unit?`<span class="setting-unit">${s.unit}</span>`:''}</div>
      <span class="type-tag">${typeLabel(s)}</span>
      ${middle}
      <span class="row-chevron">${CHEV}</span>
    </div>
    <div class="stage-input">
      <label>New value</label>
      ${control}
      <span style="color:var(--faint);font-size:12px">applies to ${selected.size} selected truck${selected.size===1?'':'s'}</span>
    </div>
    <div class="detail">${detail}</div>
  </div>`;
}

/* ============ INTERACTIONS ============ */
let viewMode = 'setting';                 // 'setting' = sections view · 'truck' = per-truck accordions
let openTrucks = new Set(['t3']);
let truckAccShown = 15;

function renderActive(){ viewMode==='setting' ? renderSections() : renderTruckFocus(); }

function setViewMode(m){
  viewMode = m;
  const settingView = m==='setting';
  document.getElementById('summaryBar').style.display = settingView?'flex':'none';
  if(!settingView) document.getElementById('settingsToolbar').style.display = 'none';
  document.getElementById('sections').style.display = settingView?'block':'none';
  document.getElementById('truckFocus').style.display = settingView?'none':'block';
  document.getElementById('vwRowSetting').classList.toggle('active', settingView);
  document.getElementById('vwRowTruck').classList.toggle('active', !settingView);
  document.getElementById('vpOptsDd').classList.remove('open');
  if(settingView) closeDrawer();
  renderAll();
}

/* ---- truck-focused view: one accordion per selected truck ---- */
const INFO_HEAD_FIELDS = [
  {label:'Unit', sid:'ro_unit'},
  {label:'Mixer Type', sid:'ro_mixer'},
  {label:'Mode', sid:'mode'},
  {label:'OOS Reason', sid:'oos_reason'},
];
function toggleTruckCard(tid){
  openTrucks.has(tid)?openTrucks.delete(tid):openTrucks.add(tid);
  renderTruckFocus();
}
function showMoreTrucks(){ truckAccShown += 15; renderTruckFocus(); }

function renderTruckFocus(){
  const box = document.getElementById('truckFocus');
  if(selected.size===0){
    box.innerHTML = `<div class="tf-toolbar"><span class="tf-count">Select trucks on the left to load their configuration.</span></div>`;
    return;
  }
  const tids = [...selected];
  const page = tids.slice(0, truckAccShown);

  const cards = page.map(tid=>{
    const t = TRUCKS.find(x=>x.id===tid);
    const open = openTrucks.has(tid);
    const info = INFO_HEAD_FIELDS.map(f=>{
      const s = SETTINGS.find(x=>x.id===f.sid);
      const e = state[tid][f.sid];
      const warn = (f.sid==='mode' && e.value!=='Live') || (f.sid==='oos_reason' && e.value!=='None');
      return `<div class="tc-field"><span class="k">${f.label}</span><span class="v ${warn?'warn':''}">${fmtVal(s, e.value)}</span></div>`;
    }).join('');
    const noValCount = SETTINGS.filter(s=>!s.locked && s.functional!==false && state[tid][s.id].value===null).length;
    const pendCount = SETTINGS.filter(s=>state[tid][s.id].status==='pending').length;

    let body = '';
    if(open){
      body = SECTIONS.filter(sec=>sec.id!=='information').map(sec=>{
        const rows = SETTINGS.filter(s=>s.sec===sec.id).map(s=>{
          if(s.functional===false){
            return `<div class="tc-row"><span class="n dimmed">${s.name}</span><span class="nonfunc-tag">Not functional</span></div>`;
          }
          const e = state[tid][s.id];
          const st = STATUS_MAP[e.status];
          return `<div class="tc-row">
            <span class="n">${s.name}${s.unit?`<span class="setting-unit">${s.unit}</span>`:''}</span>
            <span class="meta">${e.lastUpdated?`${e.lastUpdated} · ${e.submitter}`:''}</span>
            <span class="val">${fmtVal(s, e.value)}</span>
            <span class="status-cell ${st.cls}" style="min-width:96px"><span class="dot"></span>${st.label}</span>
          </div>`;
        }).join('');
        return `<div class="tc-sec-label">${sec.name}</div>${rows}`;
      }).join('');
    }

    return `<div class="truck-card ${open?'open':''}">
      <div class="tc-head" onclick="toggleTruckCard('${tid}')">
        <div><div class="tc-name">${t.name}</div><div class="tc-contract">${t.contract}</div></div>
        <div class="tc-info">${info}</div>
        ${pendCount>0?`<span class="v-chip pending"><span class="dot"></span>${pendCount} pending</span>`:''}
        ${noValCount>0?`<span class="v-chip novalue"><span class="dot"></span>${noValCount} no value</span>`:''}
        <div class="tc-chevron">${CHEV}</div>
      </div>
      <div class="tc-body">${body}</div>
    </div>`;
  }).join('');

  box.innerHTML = `<div class="tf-toolbar">
      <span class="tf-count"><b>${selected.size}</b> truck${selected.size===1?'':'s'} selected</span>
      <button class="btn btn-primary tf-update-btn" onclick="openDrawer()">Update trucks (${selected.size})</button>
    </div>
    ${cards}
    ${tids.length>truckAccShown?`<div class="show-more-wrap">
      <button class="show-more" onclick="showMoreTrucks()">Show ${Math.min(15, tids.length-truckAccShown)} more trucks</button>
      <span class="showing-count">Showing ${page.length} of ${tids.length}</span>
    </div>`:''}`;
}

/* ---- mass-update drawer ---- */
function openDrawer(){
  document.getElementById('drawerBackdrop').classList.add('open');
  renderDrawerList();
}
function closeDrawer(){
  const b = document.getElementById('drawerBackdrop');
  if(b) b.classList.remove('open');
}
function renderDrawerList(){
  const q = (document.getElementById('drawerSearch').value||'').toLowerCase();
  document.getElementById('drawerSub').textContent =
    `${selected.size} truck${selected.size===1?'':'s'} selected · pick the settings to change`;
  const list = document.getElementById('drawerList');
  list.innerHTML = SECTIONS.map(sec=>{
    const items = SETTINGS.filter(s=>s.sec===sec.id && !s.locked && s.functional!==false && (!q || s.name.toLowerCase().includes(q)));
    if(items.length===0) return '';
    return `<div class="dr-sec-label">${sec.name}</div>` + items.map(s=>{
      const isStaged = staged[s.id]!==undefined;
      return `<div class="dr-item">
        <div class="dr-item-main" onclick="toggleStage('${s.id}')">
          <div class="cb ${isStaged?'checked':''}"><svg viewBox="0 0 12 12" fill="none"><path d="M2 6.5 4.8 9 10 3.5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <span class="dr-name">${s.name}${s.unit?`<span class="setting-unit">${s.unit}</span>`:''}</span>
          <span class="type-tag">${typeLabel(s)}</span>
        </div>
        ${isStaged?`<div class="dr-input"><label>New value</label>${buildControl(s)}</div>`:''}
      </div>`;
    }).join('');
  }).join('');
  const n = Object.keys(staged).length;
  document.getElementById('drawerCount').textContent = n===0 ? 'No settings staged yet' : `${n} setting${n===1?'':'s'} staged`;
  document.getElementById('drawerReviewBtn').disabled = !stagedValid();
}

function toggleSection(id){
  collapsedSections.has(id)?collapsedSections.delete(id):collapsedSections.add(id);
  document.getElementById('sec-'+id).classList.toggle('collapsed');
}
function toggleRow(id){
  openRows.has(id)?openRows.delete(id):openRows.add(id);
  document.getElementById('row-'+id).classList.toggle('open');
}
function filterRow(sid, kind, key){
  const cur = rowFilter[sid];
  if(cur && cur.kind===kind && (kind==='novalue' || cur.key===key)){
    delete rowFilter[sid]; // toggle off
  } else {
    rowFilter[sid] = kind==='novalue' ? {kind:'novalue'} : {kind:'value', key:key};
  }
  delete detailShown[sid];
  openRows.add(sid);
  renderActive();
}
function clearRowFilter(sid){ delete rowFilter[sid]; delete detailShown[sid]; renderActive(); }
function showMore(sid){ detailShown[sid] = (detailShown[sid]||PAGE) + PAGE; renderActive(); }
function toggleIssuesOnly(){ issuesOnly = !issuesOnly; renderSections(); }
function settingHasIssue(s){
  if(s.locked || s.functional===false) return false;
  const r = rollup(s);
  return r.distinct.length>1 || r.noVal>0 || r.pending>0;
}
function toggleStage(id){
  if(staged[id]!==undefined){ delete staged[id]; }
  else {
    const s = SETTINGS.find(x=>x.id===id);
    staged[id] = s.type==='toggle' ? true : '';
  }
  renderMain();
}
function typeLabel(s){ return s.type==='toggle'?'Toggle':(s.type==='select'?'Dropdown':'Number'); }
function setStagedValue(id, v){
  staged[id]=v;
  const s = SETTINGS.find(x=>x.id===id);
  if(s.type==='toggle'){ renderMain(); }
}
function discardStaged(){ staged={}; renderMain(); }

function stagedValid(){
  const ids = Object.keys(staged);
  if(ids.length===0) return false;
  return ids.every(id=>{
    const v = staged[id];
    return v!=='' && v!==undefined && v!==null && !(typeof v==='number' && isNaN(v));
  });
}

function refreshStageBar(){
  const bar = document.getElementById('stageBar');
  const ids = Object.keys(staged);
  if(ids.length===0 || selected.size===0){ bar.classList.remove('visible'); return; }
  bar.classList.add('visible');
  const incomplete = ids.filter(id=>staged[id]===''||staged[id]===undefined||(typeof staged[id]==='number'&&isNaN(staged[id]))).length;
  document.getElementById('stageInfo').innerHTML =
    `<b>${ids.length}</b> setting${ids.length===1?'':'s'} staged · will be pushed to <b>${selected.size}</b> truck${selected.size===1?'':'s'}` +
    (incomplete>0?` · <span style="color:var(--amber)">${incomplete} missing a value</span>`:'');
  document.getElementById('reviewBtn').disabled = !stagedValid();
  // keep drawer footer in sync when it's open (typing doesn't rerender its list)
  const db = document.getElementById('drawerBackdrop');
  if(db && db.classList.contains('open')){
    const n = ids.length;
    document.getElementById('drawerCount').textContent = n===0 ? 'No settings staged yet' : `${n} setting${n===1?'':'s'} staged`;
    document.getElementById('drawerReviewBtn').disabled = !stagedValid();
  }
}
function refreshStageBarOnly(){ refreshStageBar(); }

/* ============ MODAL + SEND ============ */
function openModal(){
  if(!stagedValid()) return;
  const ids = Object.keys(staged);
  document.getElementById('modalSub').innerHTML =
    `You're about to push <b>${ids.length} setting change${ids.length===1?'':'s'}</b> to <b>${selected.size} truck${selected.size===1?'':'s'}</b>. Each truck applies the change on its next check-in; status will show <b style="color:var(--amber)">Pending</b> until the truck reports the new value back, then <b style="color:var(--green)">Confirmed</b>.`;
  document.getElementById('modalTable').innerHTML =
    `<tr><th>Setting</th><th>Section</th><th>New Value</th></tr>` +
    ids.map(id=>{
      const s = SETTINGS.find(x=>x.id===id);
      const sec = SECTIONS.find(x=>x.id===s.sec);
      return `<tr><td style="font-weight:600">${s.name}</td><td class="dim">${sec.name}</td><td class="newval">${fmtVal(s, staged[id])}</td></tr>`;
    }).join('');
  document.getElementById('confirmBtn').textContent = `Send to ${selected.size} truck${selected.size===1?'':'s'}`;
  document.getElementById('modalBackdrop').classList.add('visible');
}
function closeModal(){ document.getElementById('modalBackdrop').classList.remove('visible'); }

function sendUpdate(){
  const ids = Object.keys(staged);
  const trucks = [...selected];
  const now = 'Aug 20, 2026';
  ids.forEach(id=>{
    trucks.forEach(tid=>{
      state[tid][id] = {...state[tid][id], status:'pending', source:'Hub', submitter:'You', pendingValue: staged[id]};
    });
  });
  // simulate trucks confirming at staggered intervals; one straggler
  trucks.forEach((tid,i)=>{
    const delay = (i===trucks.length-1) ? 9000 : 1500 + Math.random()*4500;
    setTimeout(()=>{
      ids.forEach(id=>{
        const e = state[tid][id];
        state[tid][id] = {value:e.pendingValue, lastUpdated:now, source:'Hub', submitter:'You', status:'confirmed'};
        const h = getHistory(tid, id);
        h.unshift({value:e.pendingValue, date:now, submitter:'You', source:'Hub'});
      });
      renderMain();
    }, delay);
  });
  const n = trucks.length;
  staged = {};
  closeModal();
  closeDrawer();
  renderMain();
  showToast(`Update sent to ${n} truck${n===1?'':'s'} — awaiting confirmation`);
}

let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 5000);
}

/* ============ MASTER RENDER ============ */
function renderMain(){
  if(viewMode==='setting'){ renderSummary(); renderSections(); }
  else {
    renderTruckFocus();
    if(document.getElementById('drawerBackdrop').classList.contains('open')) renderDrawerList();
  }
  refreshStageBar();
}
function renderAll(){ renderTrucks(); renderMain(); }
renderAll();

/* ============ PROTOTYPE CHROME: options, viewport, theme ============ */
function toggleOpts(e){
  e.stopPropagation();
  document.getElementById('vpOptsDd').classList.toggle('open');
}
document.addEventListener('click', ()=>{
  document.getElementById('vpOptsDd').classList.remove('open');
});

let currentViewport = 'Desktop';
function setViewport(vp){
  currentViewport = vp;
  ['Desktop','Tablet','Mobile'].forEach(v=>{
    document.getElementById('vpRow'+v).classList.toggle('active', v===vp);
  });
  const cs = document.getElementById('comingSoon');
  if(vp==='Desktop'){ cs.classList.remove('show'); }
  else {
    document.getElementById('csDevice').textContent = vp;
    cs.classList.add('show');
  }
  document.getElementById('vpOptsDd').classList.remove('open');
}

const rootEl = document.documentElement;
function syncThemeSwitch(){
  document.getElementById('themeSwitch').classList.toggle('on', rootEl.classList.contains('theme-dark'));
}
function toggleTheme(){
  const dark = !rootEl.classList.contains('theme-dark');
  rootEl.classList.toggle('theme-dark', dark);
  rootEl.classList.toggle('theme-light', !dark);
  syncThemeSwitch();
  try { localStorage.setItem('adv-settings-theme', dark ? 'dark' : 'light'); } catch(e) {}
}
syncThemeSwitch();
</script>
