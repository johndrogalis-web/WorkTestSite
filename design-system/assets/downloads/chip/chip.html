<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chip · Verifi Trinity</title>
<link rel="stylesheet" href="chip.css">
<style>
  body{margin:0;font-family:'ABC Repro','Helvetica Neue',Helvetica,Arial,sans-serif;color:#171614;background:#FFFFFF}
  header{padding:24px} header h1{font-size:24px;font-weight:500;margin:0 0 4px} header p{margin:0;color:#565147}
  section{padding:24px} section[data-theme="dark"]{background:#171614;color:#FFFFFF} h2{font-size:16px;font-weight:500;margin:0 0 12px}
  .row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
</style>
</head>
<body>
<header><h1>Chip</h1><p>Hover, tab to and press a chip; press again to clear. Styles in chip.css.</p></header>
<section><h2>Light</h2><div role="group" aria-label="Filters" class="row"><span class="vf-chip info"><button class="vf-chip-in" aria-pressed="false"><i class="vf-chip-dot"></i><span>Plant 2</span></button></span><span class="vf-chip offline"><button class="vf-chip-in" aria-pressed="false"><i class="vf-chip-dot"></i><span>Truck 45730</span></button></span><span class="vf-chip live"><button class="vf-chip-in" aria-pressed="false"><i class="vf-chip-dot"></i><span>Phoenix Central</span></button></span><span class="vf-chip maint"><button class="vf-chip-in" aria-pressed="false"><i class="vf-chip-dot"></i><span>Mixer 4</span></button></span></div><div role="group" aria-label="Filters, small" class="row"><span class="vf-chip info sm"><button class="vf-chip-in" aria-pressed="false"><i class="vf-chip-dot"></i><span>Plant 2</span></button></span><span class="vf-chip offline sm"><button class="vf-chip-in" aria-pressed="false"><i class="vf-chip-dot"></i><span>Truck 45730</span></button></span><span class="vf-chip live sm"><button class="vf-chip-in" aria-pressed="false"><i class="vf-chip-dot"></i><span>Phoenix Central</span></button></span><span class="vf-chip maint sm"><button class="vf-chip-in" aria-pressed="false"><i class="vf-chip-dot"></i><span>Mixer 4</span></button></span></div></section>
<section data-theme="dark"><h2>Dark</h2><div role="group" aria-label="Filters" class="row"><span class="vf-chip info"><button class="vf-chip-in" aria-pressed="false"><i class="vf-chip-dot"></i><span>Plant 2</span></button></span><span class="vf-chip offline"><button class="vf-chip-in" aria-pressed="false"><i class="vf-chip-dot"></i><span>Truck 45730</span></button></span><span class="vf-chip live"><button class="vf-chip-in" aria-pressed="false"><i class="vf-chip-dot"></i><span>Phoenix Central</span></button></span><span class="vf-chip maint"><button class="vf-chip-in" aria-pressed="false"><i class="vf-chip-dot"></i><span>Mixer 4</span></button></span></div><div role="group" aria-label="Filters, small" class="row"><span class="vf-chip info sm"><button class="vf-chip-in" aria-pressed="false"><i class="vf-chip-dot"></i><span>Plant 2</span></button></span><span class="vf-chip offline sm"><button class="vf-chip-in" aria-pressed="false"><i class="vf-chip-dot"></i><span>Truck 45730</span></button></span><span class="vf-chip live sm"><button class="vf-chip-in" aria-pressed="false"><i class="vf-chip-dot"></i><span>Phoenix Central</span></button></span><span class="vf-chip maint sm"><button class="vf-chip-in" aria-pressed="false"><i class="vf-chip-dot"></i><span>Mixer 4</span></button></span></div></section>
<script>
document.querySelectorAll('.vf-chip-in').forEach(function(b){b.addEventListener('click',function(){b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true');});});
</script>
</body>
</html>
