<html lang="en">

<style>
  body{margin:0;font-family:'ABC Repro','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14px;color:#171614;background:#FFFFFF}
  header,section{padding:24px} header h1{font-size:24px;font-weight:500;margin:0 0 4px} header p{margin:0;color:#565147}
  section[data-theme="dark"]{background:#171614;color:#FFFFFF} h2{font-size:16px;font-weight:500;margin:0 0 12px}
  .row{display:flex;gap:16px;flex-wrap:wrap;min-height:360px} .row .vf-field{width:320px}

<body>
<header><h1>Date picker</h1><p>Type a date, or use the calendar icon. MM/DD/YYYY is the US example: show each user their own format.</p></header>
<section><h2>Light</h2><div class="row"><div class="vf-field vf-dtf vf-dp live"><label class="vf-label" for="dp17">Delivery date</label><div class="vf-dtf-wrap"><div class="vf-input"><input id="dp17" type="text" inputmode="numeric" autocomplete="off" placeholder="MM/DD/YYYY" value="" aria-describedby="dp17-h"><button type="button" class="vf-dtf-ic" aria-label="Choose a date" aria-haspopup="dialog" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></button></div><div class="vf-dtm" role="dialog" aria-label="Choose a date"><div class="vf-dtc"><div class="vf-dtc-h"><button type="button" class="nav prev" aria-label="Previous month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg></button><span class="mo" aria-live="polite">September 2026</span><button type="button" class="nav next" aria-label="Next month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg></button></div><div class="vf-dtc-g" role="grid"><span class="d wk" aria-hidden="true">S</span><span class="d wk" aria-hidden="true">M</span><span class="d wk" aria-hidden="true">T</span><span class="d wk" aria-hidden="true">W</span><span class="d wk" aria-hidden="true">T</span><span class="d wk" aria-hidden="true">F</span><span class="d wk" aria-hidden="true">S</span><span class="d empty"></span><span class="d empty"></span><button type="button" class="d" aria-label="September 1, 2026" tabindex="-1">1</button><button type="button" class="d" aria-label="September 2, 2026" tabindex="-1">2</button><button type="button" class="d" aria-label="September 3, 2026" tabindex="-1">3</button><button type="button" class="d" aria-label="September 4, 2026" tabindex="-1">4</button><button type="button" class="d" aria-label="September 5, 2026" tabindex="-1">5</button><button type="button" class="d" aria-label="September 6, 2026" tabindex="-1">6</button><button type="button" class="d" aria-label="September 7, 2026" tabindex="-1">7</button><button type="button" class="d" aria-label="September 8, 2026" tabindex="-1">8</button><button type="button" class="d" aria-label="September 9, 2026" tabindex="-1">9</button><button type="button" class="d" aria-label="September 10, 2026" tabindex="-1">10</button><button type="button" class="d" aria-label="September 11, 2026" tabindex="-1">11</button><button type="button" class="d" aria-label="September 12, 2026" tabindex="-1">12</button><button type="button" class="d" aria-label="September 13, 2026" tabindex="-1">13</button><button type="button" class="d" aria-label="September 14, 2026" tabindex="-1">14</button><button type="button" class="d today" aria-label="September 15, 2026" aria-current="date" tabindex="-1">15</button><button type="button" class="d" aria-label="September 16, 2026" tabindex="-1">16</button><button type="button" class="d" aria-label="September 17, 2026" tabindex="-1">17</button><button type="button" class="d sel" aria-label="September 18, 2026" aria-pressed="true" tabindex="-1">18</button><button type="button" class="d" aria-label="September 19, 2026" tabindex="-1">19</button><button type="button" class="d" aria-label="September 20, 2026" tabindex="-1">20</button><button type="button" class="d" aria-label="September 21, 2026" tabindex="-1">21</button><button type="button" class="d" aria-label="September 22, 2026" tabindex="-1">22</button><button type="button" class="d" aria-label="September 23, 2026" tabindex="-1">23</button><button type="button" class="d" aria-label="September 24, 2026" tabindex="-1">24</button><button type="button" class="d" aria-label="September 25, 2026" tabindex="-1">25</button><button type="button" class="d" aria-label="September 26, 2026" tabindex="-1">26</button><button type="button" class="d" aria-label="September 27, 2026" tabindex="-1">27</button><button type="button" class="d" aria-label="September 28, 2026" tabindex="-1">28</button><button type="button" class="d" aria-label="September 29, 2026" tabindex="-1">29</button><button type="button" class="d" aria-label="September 30, 2026" tabindex="-1">30</button><span class="d empty"></span><span class="d empty"></span><span class="d empty"></span><span class="d empty"></span><span class="d empty"></span><span class="d empty"></span><span class="d empty"></span><span class="d empty"></span><span class="d empty"></span><span class="d empty"></span></div></div></div></div><span class="vf-helper" id="dp17-h"><span>MM/DD/YYYY, your local format</span></span></div></div></section>
<section data-theme="dark"><h2>Dark</h2><div class="row"><div class="vf-field vf-dtf vf-dp live"><label class="vf-label" for="dp18">Delivery date</label><div class="vf-dtf-wrap"><div class="vf-input"><input id="dp18" type="text" inputmode="numeric" autocomplete="off" placeholder="MM/DD/YYYY" value="" aria-describedby="dp18-h"><button type="button" class="vf-dtf-ic" aria-label="Choose a date" aria-haspopup="dialog" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></button></div><div class="vf-dtm" role="dialog" aria-label="Choose a date"><div class="vf-dtc"><div class="vf-dtc-h"><button type="button" class="nav prev" aria-label="Previous month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg></button><span class="mo" aria-live="polite">September 2026</span><button type="button" class="nav next" aria-label="Next month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg></button></div><div class="vf-dtc-g" role="grid"><span class="d wk" aria-hidden="true">S</span><span class="d wk" aria-hidden="true">M</span><span class="d wk" aria-hidden="true">T</span><span class="d wk" aria-hidden="true">W</span><span class="d wk" aria-hidden="true">T</span><span class="d wk" aria-hidden="true">F</span><span class="d wk" aria-hidden="true">S</span><span class="d empty"></span><span class="d empty"></span><button type="button" class="d" aria-label="September 1, 2026" tabindex="-1">1</button><button type="button" class="d" aria-label="September 2, 2026" tabindex="-1">2</button><button type="button" class="d" aria-label="September 3, 2026" tabindex="-1">3</button><button type="button" class="d" aria-label="September 4, 2026" tabindex="-1">4</button><button type="button" class="d" aria-label="September 5, 2026" tabindex="-1">5</button><button type="button" class="d" aria-label="September 6, 2026" tabindex="-1">6</button><button type="button" class="d" aria-label="September 7, 2026" tabindex="-1">7</button><button type="button" class="d" aria-label="September 8, 2026" tabindex="-1">8</button><button type="button" class="d" aria-label="September 9, 2026" tabindex="-1">9</button><button type="button" class="d" aria-label="September 10, 2026" tabindex="-1">10</button><button type="button" class="d" aria-label="September 11, 2026" tabindex="-1">11</button><button type="button" class="d" aria-label="September 12, 2026" tabindex="-1">12</button><button type="button" class="d" aria-label="September 13, 2026" tabindex="-1">13</button><button type="button" class="d" aria-label="September 14, 2026" tabindex="-1">14</button><button type="button" class="d today" aria-label="September 15, 2026" aria-current="date" tabindex="-1">15</button><button type="button" class="d" aria-label="September 16, 2026" tabindex="-1">16</button><button type="button" class="d" aria-label="September 17, 2026" tabindex="-1">17</button><button type="button" class="d sel" aria-label="September 18, 2026" aria-pressed="true" tabindex="-1">18</button><button type="button" class="d" aria-label="September 19, 2026" tabindex="-1">19</button><button type="button" class="d" aria-label="September 20, 2026" tabindex="-1">20</button><button type="button" class="d" aria-label="September 21, 2026" tabindex="-1">21</button><button type="button" class="d" aria-label="September 22, 2026" tabindex="-1">22</button><button type="button" class="d" aria-label="September 23, 2026" tabindex="-1">23</button><button type="button" class="d" aria-label="September 24, 2026" tabindex="-1">24</button><button type="button" class="d" aria-label="September 25, 2026" tabindex="-1">25</button><button type="button" class="d" aria-label="September 26, 2026" tabindex="-1">26</button><button type="button" class="d" aria-label="September 27, 2026" tabindex="-1">27</button><button type="button" class="d" aria-label="September 28, 2026" tabindex="-1">28</button><button type="button" class="d" aria-label="September 29, 2026" tabindex="-1">29</button><button type="button" class="d" aria-label="September 30, 2026" tabindex="-1">30</button><span class="d empty"></span><span class="d empty"></span><span class="d empty"></span><span class="d empty"></span><span class="d empty"></span><span class="d empty"></span><span class="d empty"></span><span class="d empty"></span><span class="d empty"></span><span class="d empty"></span></div></div></div></div><span class="vf-helper" id="dp18-h"><span>MM/DD/YYYY, your local format</span></span></div></div></section>
<script>
(function(){
  var MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
  function pad(n){return (n<10?'0':'')+n}
  function fmt(d){return pad(d.getMonth()+1)+'/'+pad(d.getDate())+'/'+d.getFullYear()}
  function parse(s){s=(s||'').trim();if(!s)return null;var mo,da,y,m=/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4}|\d{2})$/.exec(s);
    if(m){mo=+m[1];da=+m[2];y=m[3]}else{m=/^(\d{8}|\d{6})$/.exec(s.replace(/\s/g,''));if(!m)return null;mo=+m[1].slice(0,2);da=+m[1].slice(2,4);y=m[1].slice(4)}
    y=+(y.length===2?'20'+y:y);var d=new Date(y,mo-1,da);if(mo<1||mo>12||d.getMonth()!==mo-1||d.getDate()!==da)return null;return d}
  document.querySelectorAll('.vf-dp.live').forEach(function(f){
    var inp=f.querySelector('input'),ic=f.querySelector('.vf-dtf-ic'),grid=f.querySelector('.vf-dtc-g'),mo=f.querySelector('.mo'),help=f.querySelector('.vf-helper span'),helpTxt=help.textContent,
        view=new Date(2026,8,1),picked=null,today=new Date(2026,8,15);
    function draw(){var y=view.getFullYear(),m=view.getMonth(),first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),h='';
      'SMTWTFS'.split('').forEach(function(c){h+='<span class="d wk" aria-hidden="true">'+c+'</span>'});
      for(var i=0;i<42;i++){var d=i-first+1;if(d<1||d>n){h+='<span class="d empty"></span>';continue}
        var dt=new Date(y,m,d),c='d'+(dt.getTime()===today.getTime()?' today':'')+(picked&&dt.getTime()===picked.getTime()?' sel':'');
        h+='<button type="button" class="'+c+'" data-d="'+d+'" tabindex="-1" aria-label="'+MON[m]+' '+d+', '+y+'"'+(dt.getTime()===today.getTime()?' aria-current="date"':'')+'>'+d+'</button>'}
      grid.innerHTML=h;mo.textContent=MON[m]+' '+y}
    function ok(d){inp.value=fmt(d);f.classList.remove('error');f.classList.add('filled');help.textContent=helpTxt}
    function bad(){f.classList.add('error');help.textContent='Enter a date like 09/18/2026'}
    function open(){f.classList.add('open');ic.setAttribute('aria-expanded','true');draw()}
    function close(back){f.classList.remove('open');ic.setAttribute('aria-expanded','false');if(back)inp.focus()}
    ic.addEventListener('click',function(){f.classList.contains('open')?close(true):(open(),(grid.querySelector('.sel')||grid.querySelector('.today')||grid.querySelector('button.d')).focus())});
    inp.addEventListener('click',open);
    f.querySelector('.prev').addEventListener('click',function(){view.setMonth(view.getMonth()-1);draw()});
    f.querySelector('.next').addEventListener('click',function(){view.setMonth(view.getMonth()+1);draw()});
    grid.addEventListener('click',function(e){var b=e.target.closest('button.d');if(!b)return;picked=new Date(view.getFullYear(),view.getMonth(),+b.dataset.d);ok(picked);close(true)});
    grid.addEventListener('keydown',function(e){var b=e.target.closest('button.d');if(!b)return;var d=+b.dataset.d,step={ArrowLeft:-1,ArrowRight:1,ArrowUp:-7,ArrowDown:7}[e.key];
      if(step){e.preventDefault();var t=new Date(view.getFullYear(),view.getMonth(),d+step);if(t.getMonth()!==view.getMonth()){view=new Date(t.getFullYear(),t.getMonth(),1);draw()}grid.querySelector('[data-d="'+t.getDate()+'"]').focus()}
      if(e.key==='PageUp'||e.key==='PageDown'){e.preventDefault();view.setMonth(view.getMonth()+(e.key==='PageUp'?-1:1));draw();grid.querySelector('button.d').focus()}});
    inp.addEventListener('input',function(){if(!f.classList.contains('open'))open();var d=parse(inp.value);if(d){picked=d;view=new Date(d.getFullYear(),d.getMonth(),1);draw()}});
    inp.addEventListener('keydown',function(e){if(e.key!=='Enter')return;e.preventDefault();if(!inp.value.trim())return;var d=parse(inp.value);if(d){picked=d;ok(d);close(false)}else bad()});
    inp.addEventListener('blur',function(){var v=inp.value.trim();if(!v){f.classList.remove('error','filled');help.textContent=helpTxt;return}var d=parse(v);if(d){picked=d;ok(d)}else bad()});
    f.addEventListener('keydown',function(e){if(e.key==='Escape'&&f.classList.contains('open')){e.preventDefault();close(true)}});
    document.addEventListener('mousedown',function(e){if(!f.contains(e.target))close(false)});
  });
})();
</script>
</body>
