<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Input · Verifi Trinity</title>
<link rel="stylesheet" href="input.css">
<style>
  :root{--sans:'ABC Repro','Helvetica Neue',Helvetica,Arial,sans-serif}
  body{margin:0;font-family:var(--sans);font-size:14px;color:#171614;background:#FFFFFF}
  header,section{padding:24px} header h1{font-size:24px;font-weight:500;margin:0 0 4px} header p{margin:0;color:#565147}
  section.pane-d{background:#171614;color:#FFFFFF} h2{font-size:16px;font-weight:500;margin:0 0 12px}
  .col{display:flex;flex-direction:column;gap:12px}
</style>
</head>
<body>
<header><h1>Input</h1><p>The bare field. Hover, click and type; Clear empties it. In a form, use Text field instead.</p></header>
<section><h2>Light</h2><div class="col"><div class="vf-field vf-bare  live" style="width:320px"><div class="vf-input"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></span><input type="text" value="" placeholder="Search trucks" aria-label="Search trucks"><button type="button" class="ic vf-inbtn" aria-label="Clear"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div></div><div class="vf-field vf-bare error" style="width:320px"><div class="vf-input"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 3h15v13H1z"/><path d="M16 8h4l3 3v5h-7z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg></span><input type="text" value="44A7" placeholder="Truck number" aria-label="Truck number" aria-invalid="true"></div></div><div class="vf-field vf-bare dis" style="width:320px"><div class="vf-input"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 3h15v13H1z"/><path d="M16 8h4l3 3v5h-7z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg></span><input type="text" value="4417" placeholder="Truck number" aria-label="Truck number" disabled></div></div></div></section>
<section class="pane-d"><h2>Dark</h2><div class="col"><div class="vf-field vf-bare  live" style="width:320px"><div class="vf-input"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></span><input type="text" value="" placeholder="Search trucks" aria-label="Search trucks"><button type="button" class="ic vf-inbtn" aria-label="Clear"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div></div><div class="vf-field vf-bare error" style="width:320px"><div class="vf-input"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 3h15v13H1z"/><path d="M16 8h4l3 3v5h-7z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg></span><input type="text" value="44A7" placeholder="Truck number" aria-label="Truck number" aria-invalid="true"></div></div><div class="vf-field vf-bare dis" style="width:320px"><div class="vf-input"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 3h15v13H1z"/><path d="M16 8h4l3 3v5h-7z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg></span><input type="text" value="4417" placeholder="Truck number" aria-label="Truck number" disabled></div></div></div></section>
<script>(function(){document.querySelectorAll('.vf-bare.live').forEach(function(f){var i=f.querySelector('input'),c=f.querySelector('.vf-inbtn');i.addEventListener('input',function(){f.classList.toggle('filled',!!i.value)});if(c)c.addEventListener('click',function(){i.value='';f.classList.remove('filled');i.focus()})})})();</script>
</body>
</html>
