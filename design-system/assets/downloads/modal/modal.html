<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modal · Verifi Trinity</title>
<link rel="stylesheet" href="modal.css">
<style>body{margin:0;padding:24px;font-family:'ABC Repro','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14px;color:#171614;background:#FFFFFF} body[data-theme="dark"]{background:#000;color:#fff} h1{font-size:24px;font-weight:500} .row{display:flex;gap:8px;flex-wrap:wrap}
.vf-btn{display:inline-flex;align-items:center;justify-content:center;height:32px;padding:0 12px;border-radius:100px;border:2px solid transparent;background:#0975C3;color:#fff;font:500 14px/1 inherit;cursor:pointer}
.vf-btn.secondary{background:#F0EEEA;color:#171614;border-color:#D0CEC8}.vf-btn.link{background:transparent;color:#0975C3;text-decoration:underline}
</style>
</head>
<body>
<h1>Modal</h1><p>Native &lt;dialog&gt;: showModal() gives the scrim, focus trap and Escape. Toggle the theme to see dark.</p>
<div class="row"><button class="vf-btn" onclick="dlg.showModal()">Open modal</button><button class="vf-btn secondary" onclick="drw.showModal()">Open drawer</button><button class="vf-btn link" onclick="document.body.dataset.theme=document.body.dataset.theme==='dark'?'':'dark'">Toggle theme</button></div>
<dialog class="vf-ov" id="dlg" aria-labelledby="dlg-t"><div class="vf-ov-head"><h2 id="dlg-t">Delete load 4417?</h2><button class="vf-ov-x" aria-label="Close" onclick="dlg.close()">&times;</button></div><div class="vf-ov-body"><p>The ticket, its slump readings and its photos are removed for everyone. This cannot be undone.</p></div><div class="vf-ov-foot"><button class="vf-btn secondary" onclick="dlg.close()">Cancel</button><span class="sp"></span><button class="vf-btn" onclick="dlg.close()">Delete load</button></div></dialog><dialog class="vf-ov drawer" id="drw" aria-labelledby="drw-t"><div class="vf-ov-head"><h2 id="drw-t">Filter loads</h2><button class="vf-ov-x" aria-label="Close" onclick="drw.close()">&times;</button></div><div class="vf-ov-body"><p>A modal drawer. It starts at 700px and grows with its content.</p></div><div class="vf-ov-foot"><button class="vf-btn secondary" onclick="drw.close()">Cancel</button><span class="sp"></span><button class="vf-btn" onclick="drw.close()">Apply</button></div></dialog>
</body>
</html>
