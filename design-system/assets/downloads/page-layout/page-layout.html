<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page layout · Verifi Trinity</title>
<link rel="stylesheet" href="page-layout.css">
<style>body{font-family:'ABC Repro','Helvetica Neue',Helvetica,Arial,sans-serif;color:#171614}[data-theme="dark"] body,[data-theme="dark"]{color:#fff}.box{background:rgba(127,121,108,.15);border-radius:8px;min-height:80px;padding:8px;font-size:12px}.app-nav a{display:block;padding:10px 12px;color:inherit;text-decoration:none}</style>
</head>
<body>
<a href="#main" style="position:absolute;left:-999px">Skip to main content</a>
<div class="app-shell">
  <header class="app-header"><button aria-label="Open menu" aria-expanded="false">&#9776;</button><b>verifi</b></header>
  <nav class="app-nav" aria-label="Main"><b style="padding:12px">verifi</b><a href="#">Home</a><a href="#">Diagnostic Center</a><a href="#">Tickets</a></nav>
  <main class="main-content" id="main">
    <div class="page-header"><h1 style="margin:0;font-size:24px;font-weight:500">Dashboard</h1><p>Resize the window: 4 columns, then 8 at 600, 12 at 840, the rail at 1200.</p></div>
    <div class="page-grid">
      <div class="box span-2">KPI</div><div class="box span-2">KPI</div><div class="box span-4">Trend</div><div class="box span-4">Summary list</div>
      <div class="box span-8">Chart</div><div class="box span-12">Data table</div>
    </div>
  </main>
</div>
</body>
</html>
