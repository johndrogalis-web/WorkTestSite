<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radio group · Verifi Trinity</title>
<link rel="stylesheet" href="radio-group.css">
<style>
  body{margin:0;font-family:'ABC Repro','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14px;color:#171614;background:#FFFFFF}
  header{padding:24px} header h1{font-size:24px;font-weight:500;margin:0 0 4px} header p{margin:0;color:#565147}
  section{padding:24px;display:flex;gap:48px} section[data-theme="dark"]{background:#171614;color:#FFFFFF}
  fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:10px} legend{font-weight:500;margin-bottom:10px;padding:0}
</style>
</head>
<body>
<header><h1>Radio group</h1><p>Tab into a group and use the arrow keys. Styles in radio-group.css.</p></header>
<section><fieldset><legend>Units shown on the ticket</legend><label class="vf-radio"><input type="radio" name="ul" checked><span class="vf-radio__c" aria-hidden="true"></span>Metric</label><label class="vf-radio"><input type="radio" name="ul"><span class="vf-radio__c" aria-hidden="true"></span>Imperial</label><label class="vf-radio"><input type="radio" name="ul"><span class="vf-radio__c" aria-hidden="true"></span>Follow the plant setting</label></fieldset><fieldset><legend>Set by the account</legend><label class="vf-radio"><input type="radio" name="al" checked disabled><span class="vf-radio__c" aria-hidden="true"></span>Metric</label><label class="vf-radio"><input type="radio" name="al" disabled><span class="vf-radio__c" aria-hidden="true"></span>Imperial</label></fieldset></section>
<section data-theme="dark"><fieldset><legend>Units shown on the ticket</legend><label class="vf-radio"><input type="radio" name="ud" checked><span class="vf-radio__c" aria-hidden="true"></span>Metric</label><label class="vf-radio"><input type="radio" name="ud"><span class="vf-radio__c" aria-hidden="true"></span>Imperial</label><label class="vf-radio"><input type="radio" name="ud"><span class="vf-radio__c" aria-hidden="true"></span>Follow the plant setting</label></fieldset><fieldset><legend>Set by the account</legend><label class="vf-radio"><input type="radio" name="ad" checked disabled><span class="vf-radio__c" aria-hidden="true"></span>Metric</label><label class="vf-radio"><input type="radio" name="ad" disabled><span class="vf-radio__c" aria-hidden="true"></span>Imperial</label></fieldset></section>
</body>
</html>
