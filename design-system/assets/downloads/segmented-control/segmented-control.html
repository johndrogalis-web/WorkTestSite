<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Segmented control · Verifi Trinity</title><link rel="stylesheet" href="segmented-control.css"><style>body{margin:0;padding:24px;font-family:"ABC Repro","Helvetica Neue",Helvetica,Arial,sans-serif}section{padding:16px}section[data-theme="dark"]{background:#171614}</style></head><body>
<section><div class="vf-seg lg hub" role="group" aria-label="Tickets view"><button class="vf-segb sel" type="button" aria-pressed="true"><span class="lbl">All</span></button><button class="vf-segb" type="button" aria-pressed="false"><span class="lbl">Fleet map</span></button><button class="vf-segb" type="button" aria-pressed="false"><span class="lbl">Phases</span></button></div></section>
<section data-theme="dark"><div class="vf-seg lg hub" role="group" aria-label="Tickets view"><button class="vf-segb sel" type="button" aria-pressed="true"><span class="lbl">All</span></button><button class="vf-segb" type="button" aria-pressed="false"><span class="lbl">Fleet map</span></button><button class="vf-segb" type="button" aria-pressed="false"><span class="lbl">Phases</span></button></div></section>
<script>document.querySelectorAll(".vf-seg").forEach(function(g){g.querySelectorAll(".vf-segb").forEach(function(b){b.onclick=function(){g.querySelectorAll(".vf-segb").forEach(function(x){x.classList.remove("sel");x.setAttribute("aria-pressed","false")});b.classList.add("sel");b.setAttribute("aria-pressed","true")}})})</script>
</body></html>
