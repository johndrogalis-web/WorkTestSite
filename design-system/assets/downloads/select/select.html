<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Select menu · Verifi Trinity</title>
<link rel="stylesheet" href="select.css">
<style>
  body{margin:0;font-family:'ABC Repro','Helvetica Neue',Helvetica,Arial,sans-serif;color:#171614;background:#FFFFFF}
  header{padding:24px} header h1{font-size:24px;font-weight:500;margin:0 0 4px} header p{margin:0;color:#565147}
  section{padding:24px} section[data-theme="dark"]{background:#171614;color:#FFFFFF}
</style>
</head>
<body>
<header><h1>Select menu</h1><p>Hover the rows; the first is selected. The trigger is the Input Field. Styles in select.css.</p></header>
<section><div class="vf-menu" role="listbox" style="position:static;width:280px"><div class="vf-menu-item sel" role="option" tabindex="-1" aria-selected="true">Phoenix Central</div><div class="vf-menu-item" role="option" tabindex="-1">Mesa Eastside</div><div class="vf-menu-item" role="option" tabindex="-1">Scottsdale N<span class="cnt">12</span></div><div class="vf-menu-item" role="option" tabindex="-1"><span>Tempe South<span class="desc">Closed on Sundays</span></span></div><div class="vf-menu-div"></div><div class="vf-menu-item dis" role="option" tabindex="-1" aria-disabled="true">Gilbert SW</div></div></section>
<section data-theme="dark"><div class="vf-menu" role="listbox" style="position:static;width:280px"><div class="vf-menu-item sel" role="option" tabindex="-1" aria-selected="true">Phoenix Central</div><div class="vf-menu-item" role="option" tabindex="-1">Mesa Eastside</div><div class="vf-menu-item" role="option" tabindex="-1">Scottsdale N<span class="cnt">12</span></div><div class="vf-menu-item" role="option" tabindex="-1"><span>Tempe South<span class="desc">Closed on Sundays</span></span></div><div class="vf-menu-div"></div><div class="vf-menu-item dis" role="option" tabindex="-1" aria-disabled="true">Gilbert SW</div></div></section>
</body>
</html>
