<script>
(function(){document.querySelectorAll('[data-live-tabs]').forEach(function(list,n){var tabs=[].slice.call(list.querySelectorAll('[role=tab]'));var panels=[];var el=list.nextElementSibling;while(el&&el.matches('[data-live-panel]')){panels.push(el);el=el.nextElementSibling;}
  tabs.forEach(function(t,i){t.id='tab'+n+'-'+i;if(panels[i]){panels[i].id='panel'+n+'-'+i;t.setAttribute('aria-controls',panels[i].id);panels[i].setAttribute('aria-labelledby',t.id);}});
  function sel(i,focus){tabs.forEach(function(t,j){var s=i===j;t.classList.toggle('sel',s);t.setAttribute('aria-selected',s?'true':'false');t.tabIndex=s?0:-1;if(panels[j])panels[j].hidden=!s;});if(focus)tabs[i].focus();tabs[i].scrollIntoView({block:'nearest',inline:'nearest'});}
  tabs.forEach(function(t,i){t.addEventListener('click',function(){if(t.getAttribute('aria-disabled')==='true')return;sel(i,false);});
    t.addEventListener('keydown',function(e){var j=i;if(e.key==='ArrowRight')j=(i+1)%tabs.length;else if(e.key==='ArrowLeft')j=(i-1+tabs.length)%tabs.length;else if(e.key==='Home')j=0;else if(e.key==='End')j=tabs.length-1;else return;e.preventDefault();while(tabs[j].getAttribute('aria-disabled')==='true'&&j!==i)j=(j+(e.key==='ArrowLeft'?-1:1)+tabs.length)%tabs.length;sel(j,true);});});
})})();
</script>
