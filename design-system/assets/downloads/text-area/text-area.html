<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Text area · Verifi Trinity</title><link rel="stylesheet" href="text-area.css"><style>body{margin:0;padding:24px;font-family:var(--sans)}section{padding:16px;display:grid;gap:16px;max-width:360px}section[data-theme="dark"]{background:#171614;color:#fff}</style></head><body>
<section><div class="vf-tfw"><div class="vf-field  area live" data-live-tf data-rule="none"><label class="vf-label" for="tf62">Notes</label><div class="vf-input"><textarea maxlength="200" id="tf62" rows="3" placeholder="Anything the driver should know" aria-describedby="tf62h"></textarea></div><span class="vf-helper" id="tf62h"><span>Up to 200 characters</span></span></div><div class="vf-field  area live" data-live-tf data-rule="required" data-msg="Say why the load is coming back"><label class="vf-label" for="tf63">Reason for return</label><div class="vf-input"><textarea id="tf63" rows="3" placeholder="Why is the load coming back?" aria-describedby="tf63h"></textarea></div><span class="vf-helper" id="tf63h"><span>Required</span></span></div></div></section>
<section data-theme="dark"><div class="vf-tfw"><div class="vf-field  area live" data-live-tf data-rule="none"><label class="vf-label" for="tf62">Notes</label><div class="vf-input"><textarea maxlength="200" id="tf62" rows="3" placeholder="Anything the driver should know" aria-describedby="tf62h"></textarea></div><span class="vf-helper" id="tf62h"><span>Up to 200 characters</span></span></div><div class="vf-field  area live" data-live-tf data-rule="required" data-msg="Say why the load is coming back"><label class="vf-label" for="tf63">Reason for return</label><div class="vf-input"><textarea id="tf63" rows="3" placeholder="Why is the load coming back?" aria-describedby="tf63h"></textarea></div><span class="vf-helper" id="tf63h"><span>Required</span></span></div></div></section>
<script>
(function(){
  var ALERT='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>';
  document.querySelectorAll('[data-live-tf]').forEach(function(f){var c=f.querySelector('input,textarea'),h=f.querySelector('.vf-helper'),ht=h.querySelector('span'),ok=ht.textContent,rule=f.dataset.rule,msg=f.dataset.msg,max=c.getAttribute('maxlength');
    function setErr(on){f.classList.toggle('error',on);if(on){h.classList.add('err');h.setAttribute('role','alert');if(!h.querySelector('svg'))h.insertAdjacentHTML('afterbegin',ALERT);ht.textContent=msg;c.setAttribute('aria-invalid','true');}else{h.classList.remove('err');h.removeAttribute('role');var s=h.querySelector('svg');if(s)s.remove();ht.textContent=ok;c.removeAttribute('aria-invalid');}}
    function valid(){var v=c.value;if(rule==='digits')return v===''||/^\d+$/.test(v);if(rule==='required')return v.trim()!=='';if(rule==='email')return v===''||/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v);return true;}
    c.addEventListener('input',function(){f.classList.toggle('filled',!!c.value);if(f.classList.contains('error')&&valid())setErr(false);if(c.tagName==='TEXTAREA'){c.style.height='auto';c.style.height=Math.max(82,c.scrollHeight)+'px';}if(max){var n=h.querySelector('.vf-count');if(n)n.textContent=c.value.length+' / '+max;}});
    c.addEventListener('blur',function(){setErr(!valid());});
    if(max){h.insertAdjacentHTML('beforeend','<span class="vf-count">'+c.value.length+' / '+max+'</span>');}
    var eye=f.querySelector('[aria-label="Show password"]');if(eye)eye.addEventListener('click',function(){var show=c.type==='password';c.type=show?'text':'password';eye.setAttribute('aria-label',show?'Hide password':'Show password');eye.setAttribute('aria-pressed',show?'true':'false');});
  });
})();
</script>
</body></html>
