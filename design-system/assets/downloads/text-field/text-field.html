<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Text field · Verifi Trinity</title><link rel="stylesheet" href="text-field.css"><style>body{margin:0;padding:24px;font-family:var(--sans)}section{padding:16px;display:grid;gap:16px;max-width:360px}section[data-theme="dark"]{background:#171614;color:#fff}</style></head><body>
<section><div class="vf-tfw"><div class="vf-field  live" data-live-tf data-rule="digits" data-msg="Enter a truck number using digits only"><label class="vf-label" for="tf35">Truck number</label><div class="vf-input"><input id="tf35" type="text" placeholder="" value="" aria-describedby="tf35h" inputmode="numeric"></div><span class="vf-helper" id="tf35h"><span>Numbers only</span></span></div><div class="vf-field  live" data-live-tf data-rule="email" data-msg="Enter an email like name@company.com"><label class="vf-label" for="tf36">Email<span class="req" aria-hidden="true">*</span></label><div class="vf-input"><input id="tf36" type="email" placeholder="name@company.com" value="" aria-describedby="tf36h"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><path d="M22 6l-10 7L2 6"/></svg></span></div><span class="vf-helper" id="tf36h"><span>We only use this for alerts</span></span></div><div class="vf-field  live" data-live-tf data-rule="required" data-msg="Enter your password"><label class="vf-label" for="tf37">Password</label><div class="vf-input"><input id="tf37" type="password" placeholder="" value="" aria-describedby="tf37h"><button type="button" class="ic vf-inbtn" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></div><span class="vf-helper" id="tf37h"><span>At least 12 characters</span></span></div></div></section>
<section data-theme="dark"><div class="vf-tfw"><div class="vf-field  live" data-live-tf data-rule="digits" data-msg="Enter a truck number using digits only"><label class="vf-label" for="tf35">Truck number</label><div class="vf-input"><input id="tf35" type="text" placeholder="" value="" aria-describedby="tf35h" inputmode="numeric"></div><span class="vf-helper" id="tf35h"><span>Numbers only</span></span></div><div class="vf-field  live" data-live-tf data-rule="email" data-msg="Enter an email like name@company.com"><label class="vf-label" for="tf36">Email<span class="req" aria-hidden="true">*</span></label><div class="vf-input"><input id="tf36" type="email" placeholder="name@company.com" value="" aria-describedby="tf36h"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><path d="M22 6l-10 7L2 6"/></svg></span></div><span class="vf-helper" id="tf36h"><span>We only use this for alerts</span></span></div><div class="vf-field  live" data-live-tf data-rule="required" data-msg="Enter your password"><label class="vf-label" for="tf37">Password</label><div class="vf-input"><input id="tf37" type="password" placeholder="" value="" aria-describedby="tf37h"><button type="button" class="ic vf-inbtn" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></div><span class="vf-helper" id="tf37h"><span>At least 12 characters</span></span></div></div></section>
<script>
(function(){
  var ALERT='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>';
  document.querySelectorAll('[data-live-tf]').forEach(function(f){var c=f.querySelector('input,textarea'),h=f.querySelector('.vf-helper'),ht=h.querySelector('span'),ok=ht.textContent,rule=f.dataset.rule,msg=f.dataset.msg,max=c.getAttribute('maxlength');
    function setErr(on){f.classList.toggle('error',on);if(on){h.classList.add('err');h.setAttribute('role','alert');if(!h.querySelector('svg'))h.insertAdjacentHTML('afterbegin',ALERT);ht.textContent=msg;c.setAttribute('aria-invalid','true');}else{h.classList.remove('err');h.removeAttribute('role');var s=h.querySelector('svg');if(s)s.remove();ht.textContent=ok;c.removeAttribute('aria-invalid');}}
    function valid(){var v=c.value;if(rule==='digits')return v===''||/^\d+$/.test(v);if(rule==='required')return v.trim()!=='';if(rule==='email')return v===''||/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v);return true;}
    c.addEventListener('input',function(){f.classList.toggle('filled',!!c.value);if(f.classList.contains('error')&&valid())setErr(false);if(c.tagName==='TEXTAREA'){c.style.height='auto';c.style.height=Math.max(82,c.scrollHeight)+'px';}if(max){var n=h.querySelector('.vf-count');if(n)n.textContent=c.value.length+' / '+max;}});
    c.addEventListener('blur',function(){setErr(!valid());});
    if(max){h.insertAdjacentHTML('beforeend','<span class="vf-count">'+c.value.length+' / '+max+'</span>');}
    var eye=f.querySelector('[aria-label="Show password"]');if(eye)eye.addEventListener('click',function(){var show=c.type==='password';c.type=show?'text':'password';eye.setAttribute('aria-label',show?'Hide password':'Show password');eye.setAttribute('aria-pressed',show?'true':'false');});
  });
})();
</script>
</body></html>
