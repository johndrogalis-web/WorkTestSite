<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toggle · Verifi Trinity</title>
<link rel="stylesheet" href="toggle.css">
<style>
  body{margin:0;font-family:'ABC Repro','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14px;color:#171614;background:#FFFFFF}
  header{padding:24px} header h1{font-size:24px;font-weight:500;margin:0 0 4px} header p{margin:0;color:#565147}
  section{padding:24px;display:flex;flex-direction:column;align-items:flex-start;gap:12px} section[data-theme="dark"]{background:#171614;color:#FFFFFF}
</style>
</head>
<body>
<header><h1>Toggle</h1><p>Click the switch or its label, or Tab and press Space. Styles in toggle.css.</p></header>
<section><label class="vf-toggle"><input type="checkbox" role="switch" checked><span class="vf-toggle__t" aria-hidden="true"></span>Live fleet updates</label><label class="vf-toggle sm"><input type="checkbox" role="switch"><span class="vf-toggle__t" aria-hidden="true"></span>Compact rows</label><label class="vf-toggle"><input type="checkbox" role="switch" checked disabled><span class="vf-toggle__t" aria-hidden="true"></span>Auto-dose (requires a sensor)</label></section>
<section data-theme="dark"><label class="vf-toggle"><input type="checkbox" role="switch" checked><span class="vf-toggle__t" aria-hidden="true"></span>Live fleet updates</label><label class="vf-toggle sm"><input type="checkbox" role="switch"><span class="vf-toggle__t" aria-hidden="true"></span>Compact rows</label><label class="vf-toggle"><input type="checkbox" role="switch" checked disabled><span class="vf-toggle__t" aria-hidden="true"></span>Auto-dose (requires a sensor)</label></section>
</body>
</html>
